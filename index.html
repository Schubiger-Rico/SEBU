<script>

SEBU.EventBus = {

    events:{},

    subscribe(event,callback){

        if(!this.events[event])
        {
            this.events[event]=[];
        }

        this.events[event].push(callback);
    },

    publish(event,data){

        if(!this.events[event])
        {
            return;
        }

        this.events[event].forEach(callback =>
        {
            callback(data);
        });
    }
};

</script>

<script>

SEBU.StorageService = class {

    static save(key,data){

        localStorage.setItem(
            key,
            JSON.stringify(data)
        );

    }

    static load(key){

        const raw =
            localStorage.getItem(key);

        if(!raw)
        {
            return null;
        }

        return JSON.parse(raw);
    }

    static remove(key){

        localStorage.removeItem(key);

    }
};

</script>

<script>

SEBU.LogService = class {

    static log(level,message){

        const logs =
            SEBU.StorageService.load("sebu_logs")
            || [];

        logs.push({

            id:crypto.randomUUID(),
            level,
            message,

            timestamp:
            new Date().toISOString()

        });

        SEBU.StorageService.save(
            "sebu_logs",
            logs
        );

        console.log(
            `[${level}] ${message}`
        );

    }
};

</script>

<script>

SEBU.MigrationService = class {

    static CURRENT_VERSION =
        "1.0.0";

    static run(){

        const metadata =
            SEBU.StorageService.load(
                "sebu_metadata"
            );

        if(!metadata)
        {
            SEBU.StorageService.save(
                "sebu_metadata",
                {
                    version:
                    this.CURRENT_VERSION
                }
            );

            return;
        }

        if(
            metadata.version !==
            this.CURRENT_VERSION
        )
        {

            metadata.version =
                this.CURRENT_VERSION;

            SEBU.StorageService.save(
                "sebu_metadata",
                metadata
            );

        }

    }

};

</script>

<script>

SEBU.BackupService = class {

    static createBackup(){

        const backup = {

            created:
            new Date().toISOString(),

            storage:
            {...localStorage}

        };

        const slots = [

            "sebu_backup_1",
            "sebu_backup_2",
            "sebu_backup_3"

        ];

        for(
            let i=slots.length-1;
            i>0;
            i--
        ){

            localStorage.setItem(

                slots[i],

                localStorage.getItem(
                    slots[i-1]
                )

            );

        }

        localStorage.setItem(

            slots[0],

            JSON.stringify(backup)

        );

    }

};

</script>

<script>

SEBU.AppController = {

    init(){

        SEBU.LogService.log(
            "info",
            "SEBU gestartet"
        );

        SEBU.MigrationService.run();

        SEBU.EventBus.publish(
            "app:started",
            {}
        );

    }

};

</script>

<script>

document.addEventListener(

    "DOMContentLoaded",

    () => {

        SEBU.AppController.init();

    }

);

</script>

<script>

SEBU.FavoriteService = class {

    static STORAGE_KEY =
        "sebu_favorites";

    static LIMIT = 5;

    static getAll(){

        return (
            SEBU.StorageService.load(
                this.STORAGE_KEY
            ) || []
        );

    }

    static saveAll(data){

        SEBU.StorageService.save(
            this.STORAGE_KEY,
            data
        );

    }

    static add(product){

        const favorites =
            this.getAll();

        const exists =
            favorites.find(

                f =>
                f.product ===
                product.product

            );

        if(exists)
        {
            return;
        }

        favorites.push({

            id:crypto.randomUUID(),

            product:
                product.product,

            amount:
                product.amount,

            unit:
                product.unit,

            category:
                product.category

        });

        this.saveAll(
            favorites
        );

    }

};

</script>

<script>

SEBU.HistoryService = class {

    static STORAGE_KEY =
        "sebu_history";

    static getAll(){

        return (
            SEBU.StorageService.load(
                this.STORAGE_KEY
            ) || []
        );

    }

    static saveAll(data){

        SEBU.StorageService.save(
            this.STORAGE_KEY,
            data
        );

    }

    static addPurchase(product){

        const history =
            this.getAll();

        const entry = {

            id:crypto.randomUUID(),

            product:
                product.product,

            amount:
                product.amount,

            unit:
                product.unit,

            category:
                product.category,

            price:
                product.price || "",

            date:
                new Date()
                .toISOString()

        };

        history.push(entry);

        this.saveAll(history);

        this.checkFavorite(
            product
        );

    }

    static checkFavorite(product){

        const history =
            this.getAll();

        const count =
            history.filter(

                item =>

                item.product ===
                product.product

            ).length;

        if(
            count >=
            SEBU.FavoriteService
            .LIMIT
        ){

            SEBU
            .FavoriteService
            .add(product);

        }

    }

};

</script>

<script>

SEBU.ArchiveService = class {

    static STORAGE_KEY =
        "sebu_archive";

    static getAll(){

        return (
            SEBU.StorageService.load(
                this.STORAGE_KEY
            ) || []
        );

    }

    static saveAll(data){

        SEBU.StorageService.save(
            this.STORAGE_KEY,
            data
        );

    }

    static archiveProduct(id){

        const products =
            SEBU.ProductService.getAll();

        const index =
            products.findIndex(
                p => p.id === id
            );

        if(index < 0)
        {
            return;
        }

        const product =
            products[index];

        product.archived = true;

        const archive =
            this.getAll();

        archive.push({

            id:crypto.randomUUID(),

            entityType:"product",

            entityId:id,

            name:product.product,

            archivedAt:
                new Date()
                .toISOString()

        });

        this.saveAll(archive);

        SEBU.ProductService
            .saveAll(products);

        SEBU.EventBus.publish(
            "archive:created"
        );

    }

    static restore(entityId){

        const archive =
            this.getAll();

        const item =
            archive.find(
                a =>
                a.entityId ===
                entityId
            );

        if(!item)
        {
            return;
        }

        if(
            item.entityType ===
            "product"
        ){

            const products =
                SEBU.ProductService
                .getAll();

            const product =
                products.find(
                    p =>
                    p.id ===
                    entityId
                );

            if(product)
            {
                product.archived =
                    false;

                SEBU.ProductService
                    .saveAll(
                        products
                    );
            }

        }

        const filtered =
            archive.filter(
                a =>
                a.entityId !==
                entityId
            );

        this.saveAll(
            filtered
        );

        SEBU.EventBus.publish(
            "archive:restored"
        );

    }

    static deleteForever(entityId){

        const archive =
            this.getAll();

        const filtered =
            archive.filter(

                a =>
                a.entityId !==
                entityId

            );

        this.saveAll(
            filtered
        );

        SEBU.EventBus.publish(
            "archive:deleted"
        );

    }

};

</script>

<script>

SEBU.BackupService
.restoreBackup =

function(slot){

    const backup =
        localStorage.getItem(
            slot
        );

    if(!backup)
    {
        return false;
    }

    const data =
        JSON.parse(backup);

    localStorage.clear();

    Object.entries(
        data.storage
    ).forEach(

        ([key,value]) => {

            localStorage.setItem(
                key,
                value
            );

        }

    );

    return true;

};

</script>

<script>

SEBU.BudgetService = class {

    static STORAGE_KEY =
        "sebu_budgets";

    static getAll(){

        return (
            SEBU.StorageService.load(
                this.STORAGE_KEY
            ) || []
        );

    }

    static saveAll(data){

        SEBU.StorageService.save(
            this.STORAGE_KEY,
            data
        );

    }

    static create(name,amount){

        const budgets =
            this.getAll();

        budgets.push({

            id:crypto.randomUUID(),

            name,

            amount:Number(amount),

            spent:0,

            archived:false

        });

        this.saveAll(budgets);

    }

    static getRemaining(id){

        const budget =
            this.getAll().find(
                b => b.id === id
            );

        if(!budget)
        {
            return 0;
        }

        return (
            budget.amount -
            budget.spent

<script>

SEBU.GPSService = class {

    static lastPosition = null;

    static start(){

        const settings =
            SEBU.SettingsService
            .get();

        if(
            settings.gpsMode ===
            "off"
        ){
            return;
        }

        if(
            !navigator.geolocation
        ){
            return;
        }

        navigator.geolocation
        .getCurrentPosition(

            position => {

                this.lastPosition =
                    position;

                SEBU.EventBus.publish(

                    "gps:position",

                    position

                );

            }

        );

    }

};

</script>
