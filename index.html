<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartShop V5</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400&family=Quicksand:wght@600;700&display=swap">
<style>
:root{--bg:#f2f5f3;--card:#fff;--ink:#14231e;--mute:#5d6e67;--line:#d9e1dd;--red:#c8453b;--yel:#c99a12;--grn:#2e9e57;--acc:#1f8a70;--onacc:#fff;--fs:16px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1815;--card:#1a2622;--ink:#e8f0ec;--mute:#93a59d;--line:#2c3b36;--red:#e5766d;--yel:#e3b93f;--grn:#5dc783}}
:root[data-theme="dark"]{--bg:#0f1815;--card:#1a2622;--ink:#e8f0ec;--mute:#93a59d;--line:#2c3b36;--red:#e5766d;--yel:#e3b93f;--grn:#5dc783}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 var(--fs)/1.3 Oswald,"Arial Narrow",sans-serif}
*,*::before,*::after{box-sizing:inherit}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#app{max-width:40em;margin:0 auto;padding:.75em .75em 5em}
h1,h2{font-family:Quicksand,"Trebuchet MS",sans-serif;font-weight:700;margin:0}
h1{font-size:1.6em}h2{font-size:1.15em;margin:1.2em 0 .5em}
header{display:flex;align-items:center;justify-content:space-between;position:relative;margin-bottom:.6em}
button,input,select{font:inherit;color:inherit}
.r{border-radius:.7em}
.btn{min-height:calc(var(--fs)*1.67);min-width:calc(var(--fs)*1.67);padding:0 .8em;border:1px solid var(--line);background:var(--card);border-radius:.7em;cursor:pointer}
.btn.pri{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.field{height:calc(var(--fs)*1.67);padding:0 .7em;border:1px solid var(--line);background:var(--card);border-radius:.7em;min-width:0}
.add{display:grid;grid-template-columns:1fr 4em 5em auto;gap:.4em;margin-bottom:1em}
.card{display:flex;align-items:center;gap:.5em;min-height:calc(var(--fs)*1.67);padding:.3em .4em .3em .7em;margin-bottom:.4em;background:var(--card);border:1px solid var(--line);border-radius:.7em}
.card .nm{flex:1;min-width:0;overflow-wrap:anywhere}.card .q{color:var(--mute);white-space:nowrap}
.card.done .nm{color:var(--mute)}
.fire{border-color:var(--red);color:var(--red)}
.fire.on{background:var(--grn);border-color:var(--grn);color:#fff}
.menu{position:absolute;right:0;top:100%;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:.7em;padding:.3em;min-width:12em;box-shadow:0 .5em 1.5em #0003}
.menu button{display:flex;gap:.6em;width:100%;text-align:left;border:0;background:none;padding:.5em .7em;border-radius:.5em;cursor:pointer}
.menu button.cur{background:var(--acc);color:var(--onacc)}
.menu.min button span:last-child{display:none}.menu.big{font-size:1.25em}
.empty{padding:1.5em 1em;border:1px dashed var(--line);border-radius:.7em;color:var(--mute);text-align:center}
.row{display:flex;align-items:center;justify-content:space-between;gap:1em;padding:.5em 0;border-bottom:1px solid var(--line)}
.seg{display:flex;gap:.3em}.seg .btn.sel{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=color]{padding:0;width:calc(var(--fs)*2.5);cursor:pointer}
.sw{display:flex;gap:.4em;flex-wrap:wrap;margin:.4em 0}
.sw i{width:calc(var(--fs)*1.67);height:calc(var(--fs)*1.67);border-radius:.7em;border:2px solid var(--card);outline:1px solid var(--line);cursor:pointer}
.mute{color:var(--mute)}.small{font-size:.85em}
#toast{position:fixed;left:50%;bottom:calc(1.5em + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.5em 1em;border-radius:.7em;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script>
(function(){
var KEY='smartshop.v5';
var DEF=function(){return{items:[],recent:[],favs:[],hist:[],set:{fs:16,theme:'auto',accent:'#1f8a70',mode:'normal',autoFav:true,gps:'off',radius:100,quiet:false,vib:false,openList:false}}};
var S=load(),view='list',menu=false,editId=null,draft={n:'',q:'1',u:'Stk'},gpsMsg='',tt;
var UNITS=['Stk','Pack','kg','g','l','ml'];
var MENU=[['list','🛒','Einkaufsliste'],['favs','★','Favoriten'],['deals','🔥','Aktionen'],['ideas','💡','Ideen'],['settings','⚙','Einstellungen']];
var ACC=['#1f8a70','#2f6fd0','#8a4fd0','#d0502f','#c28a00','#d03f7a'];
function load(){try{var r=JSON.parse(localStorage.getItem(KEY));if(r&&r.set){var d=DEF();Object.assign(d,r);d.set=Object.assign(DEF().set,r.set);return d}}catch(e){}return DEF()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function say(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show')},2200)}
function ink(h){var n=parseInt(h.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return(.299*r+.587*g+.114*b)>150?'#10201a':'#fff'}
function theme(){var r=document.documentElement,s=S.set;r.style.setProperty('--fs',s.fs+'px');r.style.setProperty('--acc',s.accent);r.style.setProperty('--onacc',ink(s.accent));
if(s.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',s.theme)}
function find(a,n,u){n=n.trim().toLowerCase();return a.filter(function(x){return x.name.toLowerCase()===n&&(u===undefined||x.unit===u)})[0]}
function fmt(i){return i.qty+' '+i.unit}
function addItem(name,qty,unit){
 name=name.trim();if(!name)return say('Bitte einen Produktnamen eingeben.');
 qty=parseFloat(String(qty).replace(',','.'));if(!(qty>0))qty=1;
 var d=find(S.items,name,unit);
 if(d){d.qty=Math.round((d.qty+qty)*100)/100;say('Zusammengeführt: '+esc(d.name)+' ('+fmt(d)+')')}
 else S.items.push({id:uid(),name:name,qty:qty,unit:unit,fire:false});
 save()}
function check(id){
 var i=S.items.filter(function(x){return x.id===id})[0];if(!i)return;
 S.items=S.items.filter(function(x){return x.id!==id});
 S.recent=S.recent.filter(function(x){return x.name.toLowerCase()!==i.name.toLowerCase()});
 S.recent.unshift({id:uid(),name:i.name,qty:i.qty,unit:i.unit});S.recent=S.recent.slice(0,30);
 S.hist.unshift({id:uid(),name:i.name,qty:i.qty,unit:i.unit,date:new Date().toISOString(),price:null,store:null,deal:i.fire});S.hist=S.hist.slice(0,500);
 var f=find(S.favs,i.name);
 if(f){f.qty=i.qty;f.unit=i.unit}else if(S.set.autoFav)S.favs.push({id:uid(),name:i.name,qty:i.qty,unit:i.unit});
 save()}
function R(){theme();var h='<header><h1>SmartShop</h1><button class="btn" data-a="menu" aria-label="Menü" aria-expanded="'+menu+'">•••</button>';
 if(menu){h+='<nav class="menu '+(S.set.mode==='minimal'?'min':S.set.mode==='gross'?'big':'')+'">'+MENU.map(function(m){return'<button data-a="go" data-v="'+m[0]+'" class="'+(m[0]===view?'cur':'')+'"><span>'+m[1]+'</span><span>'+m[2]+'</span></button>'}).join('')+'</nav>'}
 h+='</header>';
 h+=view==='list'?vList():view==='favs'?vFavs():view==='settings'?vSet():vSoon();
 document.getElementById('app').innerHTML=h}
function opts(sel){return UNITS.map(function(u){return'<option'+(u===sel?' selected':'')+'>'+u+'</option>'}).join('')}
function vList(){
 var h='<div class="add"><input class="field" id="dn" placeholder="Produkt hinzufügen" value="'+esc(draft.n)+'" autocomplete="off"><input class="field" id="dq" inputmode="decimal" value="'+esc(draft.q)+'" aria-label="Menge"><select class="field" id="du" aria-label="Einheit">'+opts(draft.u)+'</select><button class="btn pri" data-a="add">＋</button></div>';
 if(!S.items.length)h+='<div class="empty">Deine Einkaufsliste ist leer. Schreib oben das erste Produkt hinein.</div>';
 S.items.forEach(function(i){
  if(editId===i.id)h+='<div class="card"><input class="field" style="flex:1" id="en" value="'+esc(i.name)+'"><input class="field" style="width:4em" id="eq" inputmode="decimal" value="'+i.qty+'"><select class="field" id="eu">'+opts(i.unit)+'</select><button class="btn pri" data-a="esave" data-id="'+i.id+'">OK</button></div>';
  else h+='<div class="card"><button class="btn" data-a="check" data-id="'+i.id+'" aria-label="Abhaken">✓</button><span class="nm" data-a="edit" data-id="'+i.id+'">'+esc(i.name)+'</span><span class="q">'+esc(fmt(i))+'</span><button class="btn fire'+(i.fire?' on':'')+'" data-a="fire" data-id="'+i.id+'" aria-label="Aktionssuche">🔥</button><button class="btn" data-a="fav" data-id="'+i.id+'" aria-label="Favorit">'+(find(S.favs,i.name)?'★':'☆')+'</button><button class="btn" data-a="del" data-id="'+i.id+'" aria-label="Löschen">✕</button></div>'});
 h+='<h2>Letzte Produkte</h2>';
 if(!S.recent.length)h+='<div class="empty">Abgehakte Produkte erscheinen hier und lassen sich zurückholen.</div>';
 S.recent.slice(0,12).forEach(function(i){h+='<div class="card done"><span class="nm">'+esc(i.name)+'</span><span class="q">'+esc(fmt(i))+'</span><button class="btn" data-a="back" data-id="'+i.id+'">Zurückholen</button></div>'});
 return h}
function vFavs(){
 var h='<h2>Favoriten</h2>';
 if(!S.favs.length)h+='<div class="empty">Noch keine Favoriten. Markiere Produkte mit ☆ oder aktiviere automatische Favoriten in den Einstellungen.</div>';
 S.favs.forEach(function(i){h+='<div class="card"><span class="nm">'+esc(i.name)+'</span><span class="q">'+esc(fmt(i))+'</span><button class="btn pri" data-a="favadd" data-id="'+i.id+'">＋ Liste</button><button class="btn" data-a="favdel" data-id="'+i.id+'" aria-label="Entfernen">✕</button></div>'});
 h+='<h2>Verlauf</h2>';
 if(!S.hist.length)h+='<div class="empty">Der Verlauf füllt sich, sobald du Produkte abhakst.</div>';
 else h+='<div class="row"><span class="mute small">'+S.hist.length+' Einträge</span><button class="btn" data-a="clearh">Verlauf leeren</button></div>';
 S.hist.slice(0,50).forEach(function(i){h+='<div class="card done"><span class="nm">'+esc(i.name)+'</span><span class="q">'+esc(fmt(i))+' · '+new Date(i.date).toLocaleDateString('de-CH')+'</span></div>'});
 return h}
function seg(k,vals){return'<div class="seg">'+vals.map(function(v){return'<button class="btn'+(S.set[k]===v[0]?' sel':'')+'" data-a="set" data-k="'+k+'" data-v="'+v[0]+'">'+v[1]+'</button>'}).join('')+'</div>'}
function tog(k,l){return'<div class="row"><span>'+l+'</span>'+seg(k,[[true,'Ja'],[false,'Nein']]).replace(/data-v="(true|false)"/g,'data-v="$1" data-b="1"')+'</div>'}
function vSet(){var s=S.set;
 return'<h2>Darstellung</h2><div class="row"><span>Schriftgrösse <b id="fsv">'+s.fs+' px</b></span></div><input type="range" id="fs" min="10" max="40" value="'+s.fs+'" aria-label="Schriftgrösse">'
 +'<div class="row"><span>Design</span>'+seg('theme',[['light','Hell'],['dark','Dunkel'],['auto','Auto']])+'</div>'
 +'<div class="row"><span>Menü</span>'+seg('mode',[['minimal','Minimal'],['normal','Normal'],['gross','Gross']])+'</div>'
 +'<div class="row"><span>Akzentfarbe</span><input type="color" id="ac" value="'+s.accent+'" class="field" aria-label="Akzentfarbe"></div>'
 +'<div class="sw">'+ACC.map(function(c){return'<i data-a="acc" data-v="'+c+'" style="background:'+c+'"></i>'}).join('')+'</div>'
 +'<div class="card" style="margin-top:.6em"><span class="nm">Live-Vorschau</span><button class="btn pri">Button</button></div>'
 +'<h2>Favoriten</h2>'+tog('autoFav','Automatische Favoriten')
 +'<h2>GPS</h2><div class="row"><span>Modus</span>'+seg('gps',[['off','Aus'],['ask','Nachfragen'],['auto','Automatisch']])+'</div>'
 +'<div class="row"><span>Radius <b id="rv">'+s.radius+' m</b></span></div><input type="range" id="rad" min="25" max="250" step="25" value="'+s.radius+'" aria-label="Radius">'
 +tog('quiet','Lautlos schalten')+tog('vib','Vibration')+tog('openList','Liste öffnen')
 +'<div class="row"><button class="btn" data-a="gps">Standort testen</button><span class="mute small">'+esc(gpsMsg)+'</span></div>'
 +'<h2>Daten</h2><p class="mute small">Alles wird automatisch auf diesem Gerät gespeichert.</p><button class="btn" data-a="reset">Alle Daten löschen</button>'}
function vSoon(){var d=view==='deals';return'<h2>'+(d?'Aktionen':'Ideen')+'</h2><div class="empty">'+(d?'Die Aktionssuche (Block 10/11) ist noch nicht gebaut.':'Rezepte und Ideen (Block 14) sind noch nicht gebaut.')+'</div>'}
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-a]');
 if(!el){if(menu){menu=false;R()}return}
 var a=el.dataset.a,id=el.dataset.id,i;
 if(a==='menu'){menu=!menu}
 else if(a==='go'){view=el.dataset.v;menu=false;editId=null}
 else if(a==='add'){var n=document.getElementById('dn').value,q=document.getElementById('dq').value,u=document.getElementById('du').value;
  if(!n.trim()){say('Bitte einen Produktnamen eingeben.');return}
  addItem(n,q,u);draft={n:'',q:'1',u:u};R();var f=document.getElementById('dn');if(f)f.focus();return}
 else if(a==='check')check(id);
 else if(a==='edit')editId=id;
 else if(a==='esave'){i=S.items.filter(function(x){return x.id===id})[0];if(i){var nn=document.getElementById('en').value.trim(),qq=parseFloat(document.getElementById('eq').value.replace(',','.'));if(nn)i.name=nn;if(qq>0)i.qty=qq;i.unit=document.getElementById('eu').value;save()}editId=null}
 else if(a==='fire'){i=S.items.filter(function(x){return x.id===id})[0];if(i){i.fire=!i.fire;save()}}
 else if(a==='fav'){i=S.items.filter(function(x){return x.id===id})[0];if(i){var f2=find(S.favs,i.name);if(f2)S.favs=S.favs.filter(function(x){return x!==f2});else S.favs.push({id:uid(),name:i.name,qty:i.qty,unit:i.unit});save()}}
 else if(a==='del'){S.items=S.items.filter(function(x){return x.id!==id});save()}
 else if(a==='back'){i=S.recent.filter(function(x){return x.id===id})[0];if(i){addItem(i.name,i.qty,i.unit);S.recent=S.recent.filter(function(x){return x.id!==id});save()}}
 else if(a==='favadd'){i=S.favs.filter(function(x){return x.id===id})[0];if(i){addItem(i.name,i.qty,i.unit);say('Zur Liste hinzugefügt')}}
 else if(a==='favdel'){S.favs=S.favs.filter(function(x){return x.id!==id});save()}
 else if(a==='clearh'){S.hist=[];save()}
 else if(a==='set'){var v=el.dataset.v;S.set[el.dataset.k]=el.dataset.b?v==='true':v;save()}
 else if(a==='acc'){S.set.accent=el.dataset.v;save()}
 else if(a==='gps'){if(!navigator.geolocation){gpsMsg='GPS nicht verfügbar'}else{gpsMsg='Suche …';navigator.geolocation.getCurrentPosition(function(p){gpsMsg=p.coords.latitude.toFixed(4)+', '+p.coords.longitude.toFixed(4)+' (±'+Math.round(p.coords.accuracy)+' m)';if(view==='settings')R()},function(){gpsMsg='Kein Zugriff auf den Standort';if(view==='settings')R()},{timeout:8000})}}
 else if(a==='reset'){if(el.dataset.s){S=DEF();view='list';save()}else{el.dataset.s='1';el.textContent='Wirklich löschen? Nochmals tippen';return}}
 R()});
document.addEventListener('input',function(e){var t=e.target,s=S.set;
 if(t.id==='dn')draft.n=t.value;else if(t.id==='dq')draft.q=t.value;else if(t.id==='du')draft.u=t.value;
 else if(t.id==='fs'){s.fs=+t.value;document.getElementById('fsv').textContent=s.fs+' px';theme();save()}
 else if(t.id==='rad'){s.radius=+t.value;document.getElementById('rv').textContent=s.radius+' m';save()}
 else if(t.id==='ac'){s.accent=t.value;theme();save()}});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&(e.target.id==='dn'||e.target.id==='dq')){e.preventDefault();var b=document.querySelector('[data-a="add"]');if(b)b.click()}if(e.key==='Escape'&&menu){menu=false;R()}});
R();
})();
</script>
</body>
</html>
